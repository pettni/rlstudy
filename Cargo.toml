[package]
name = "rlstudy"
version = "0.1.0"
edition = "2024"
description = "A small study crate for data types and algorithms"
license = "MIT"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["autodiff", "flex", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
ndarray = "0.17.2"
num-traits = "0.2"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
rand = "0.10.2"
rand_distr = "0.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10"

[build-dependencies]
pyo3-build-config = "0.29.2"
