mode: dqn
gamma: 0.9
q_network:
  learning_rate:
    type: linear
    initial: 0.05
    final_value: 0.001
    steps: 5000
  hidden_dims: [100]
  activation: relu
batch_size: 512
replay_capacity: 10000
warm_up_transitions: 1024
episodes: 250
episode_length: 30
epsilon_schedule:
  type: constant
  value: 0.9
target_update:
  type: soft
  rate: 0.005
