mode: ddqn
gamma: 0.99
learning_rate:
  type: constant
  value: 0.001
batch_size: 64
replay_capacity: 10000
warm_up_transitions: 256
episodes: 300
epsilon_schedule:
  type: exponential
  initial: 1.0
  final_value: 0.01
  decay: 2500
target_update:
  type: soft
  rate: 0.01
loss: l2
gradient_clip_value: 100.0
hidden_dims: 64
