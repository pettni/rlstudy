gamma: 0.99
pi_network:
  learning_rate:
    type: stepwise
    initial: 0.001
    changes:
      - [200, 0.0001]
  hidden_dims: [128]
  activation: relu
v_network:
  learning_rate:
    type: stepwise
    initial: 0.003
    changes:
      - [200, 0.0003]
  hidden_dims: [128]
  activation: relu
episodes: 250
episode_length: 500
